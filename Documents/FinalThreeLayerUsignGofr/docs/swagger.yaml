definitions:
  models.Task:
    properties:
      completed:
        example: false
        type: boolean
      id:
        example: 1
        type: integer
      title:
        example: Complete project
        type: string
      user_id:
        example: 123
        type: integer
    type: object
  models.User:
    properties:
      id:
        description: User ID example
        example: 123
        type: integer
      name:
        description: User name example
        example: John Doe
        type: string
    type: object
info:
  contact: {}
paths:
  /tasks:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all tasks
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            items:
              $ref: '#/definitions/models.Task'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get all tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Add a new task to the system
      parameters:
      - description: Task data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/models.Task'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
        "400":
          description: Invalid input/Empty title
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Create a new task
      tags:
      - Tasks
  /tasks/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a task by its ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Task deleted successfully
        "400":
          description: Invalid ID format
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Delete a task
      tags:
      - Tasks
    get:
      consumes:
      - application/json
      description: Get a single task by its ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task details
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Invalid ID format
          schema:
            type: object
        "404":
          description: Task not found
          schema:
            type: object
      summary: Get a task by ID
      tags:
      - Tasks
    put:
      consumes:
      - application/json
      description: Update a task's status to complete
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task marked as complete
        "400":
          description: Invalid ID format
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Mark task as complete
      tags:
      - Tasks
  /users:
    post:
      consumes:
      - application/json
      description: Add a new user to the system
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
        "400":
          description: Invalid input/Empty fields
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Create a new user
      tags:
      - Users
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Get user details by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid ID format
          schema:
            type: object
        "404":
          description: User not found
          schema:
            type: object
      summary: Get user by ID
      tags:
      - Users
swagger: "2.0"
